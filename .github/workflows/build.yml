name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest already ships the Android SDK ($ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v4

      # services.gradle.org has been refusing connections from the runner; fall back to
      # Gradle's official mirror on GitHub Releases for the wrapper distribution.
      - name: Pick Gradle distribution host
        run: |
          if ! curl -sfI --max-time 15 https://services.gradle.org/distributions/ >/dev/null; then
            echo "services.gradle.org unreachable, using GitHub mirror"
            sed -i -E 's#https\\://services.gradle.org/distributions/(gradle-([0-9.]+)-bin.zip)#https\\://github.com/gradle/gradle-distributions/releases/download/v\2/\1#' gradle/wrapper/gradle-wrapper.properties
          fi
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          for h in dl.google.com repo.maven.apache.org plugins.gradle.org; do
            curl -sfI --max-time 15 "https://$h/" >/dev/null && echo "$h ok" || echo "$h UNREACHABLE"
          done

      - name: Build release APKs (numen + standard)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleNumenRelease assembleStandardRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/numen/release/*.apk out/OpenSwipe-numen.apk
          cp app/build/outputs/apk/standard/release/*.apk out/OpenSwipe-standard.apk
          cp deploy/numen/openswipe.json deploy/numen/install.sh out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSwipe-apks
          path: out/*

      # Rolling pre-release with the latest APKs from every push, so there is a stable
      # download link that does not need a GitHub login (artifacts do).
      - name: Publish "latest" pre-release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name == 'main' && 'main' || 'dev' }}
          name: Latest build (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          body: |
            Automatic build from `${{ github.ref_name }}` @ ${{ github.sha }}.
            - **OpenSwipe-numen.apk** — Numen Air U50 build (English, keyboard-safe defaults)
            - **OpenSwipe-standard.apk** — generic build
          files: out/*
