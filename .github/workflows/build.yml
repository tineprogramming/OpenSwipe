name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest already ships the Android SDK ($ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v4

      # The runner reaches the internet through an HTTP proxy (curl works via $https_proxy,
      # but the JVM ignores those env vars and gets "Connection refused"). Pass the proxy
      # to every JVM, including the Gradle wrapper download, and trust the proxy's CA if set.
      - name: Configure JVM proxy
        run: |
          env | grep -i -E '^(https?|no|all)_proxy=' | sed -E 's#(://)[^@/]*@#\1***@#' || echo "no proxy env"
          P="${https_proxy:-${HTTPS_PROXY:-${http_proxy:-$HTTP_PROXY}}}"
          OPTS=""
          if [ -n "$P" ]; then
            HP="${P#*://}"; HP="${HP##*@}"; HP="${HP%%/*}"
            HOST="${HP%%:*}"; PORT="${HP##*:}"; [ "$PORT" = "$HP" ] && PORT=80
            NP="${no_proxy:-$NO_PROXY}"; NP="$(echo "$NP" | tr ',' '|')"
            OPTS="-Dhttps.proxyHost=$HOST -Dhttps.proxyPort=$PORT -Dhttp.proxyHost=$HOST -Dhttp.proxyPort=$PORT"
            [ -n "$NP" ] && OPTS="$OPTS -Dhttp.nonProxyHosts=$NP"
          fi
          CA="${SSL_CERT_FILE:-${NODE_EXTRA_CA_CERTS:-${REQUESTS_CA_BUNDLE:-}}}"
          if [ -n "$CA" ] && [ -f "$CA" ]; then
            cp "$JAVA_HOME/lib/security/cacerts" "$RUNNER_TEMP/cacerts"
            csplit -s -z -f "$RUNNER_TEMP/ca-" "$CA" '/-----BEGIN CERTIFICATE-----/' '{*}' || true
            for c in "$RUNNER_TEMP"/ca-*; do
              keytool -importcert -noprompt -keystore "$RUNNER_TEMP/cacerts" -storepass changeit -alias "$(basename $c)" -file "$c" >/dev/null 2>&1 || true
            done
            OPTS="$OPTS -Djavax.net.ssl.trustStore=$RUNNER_TEMP/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
          fi
          echo "JVM opts: $OPTS"
          echo "JAVA_TOOL_OPTIONS=$OPTS" >> "$GITHUB_ENV"

      - name: Build release APKs (numen + standard)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleNumenRelease assembleStandardRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/numen/release/*.apk out/OpenSwipe-numen.apk
          cp app/build/outputs/apk/standard/release/*.apk out/OpenSwipe-standard.apk
          cp deploy/numen/openswipe.json deploy/numen/install.sh out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSwipe-apks
          path: out/*

      # Rolling pre-release with the latest APKs from every push, so there is a stable
      # download link that does not need a GitHub login (artifacts do).
      - name: Publish "latest" pre-release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name == 'main' && 'main' || 'dev' }}
          name: Latest build (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          body: |
            Automatic build from `${{ github.ref_name }}` @ ${{ github.sha }}.
            - **OpenSwipe-numen.apk** — Numen Air U50 build (English, keyboard-safe defaults)
            - **OpenSwipe-standard.apk** — generic build
          files: out/*
